name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (advisory)
        continue-on-error: true
        run: composer phpstan

      - name: Run non-browser tests
        run: bash tests/run.sh --no-browser --bail
